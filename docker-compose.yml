# Local database with the whole schema. Usage: docker compose up
# PostgreSQL listens on localhost:5432 (user and password aquasense); Flyway applies the migrations and exits.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: aquasense
      POSTGRES_USER: aquasense
      POSTGRES_PASSWORD: aquasense
    ports:
      - "5432:5432"
    volumes:
      - aquasense-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aquasense"]
      interval: 5s
      retries: 12
  migrate:
    image: flyway/flyway:10.20.1
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./migrations:/flyway/sql:ro
    command: -url=jdbc:postgresql://db:5432/aquasense -user=aquasense -password=aquasense -validateMigrationNaming=true migrate
volumes:
  aquasense-data:
